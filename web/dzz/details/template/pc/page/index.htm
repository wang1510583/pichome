<script>
	function CopyTxt(item,text){
		var input = document.createElement('input'); input.setAttribute('id', 'copyInput');
		input.setAttribute('value', text);
		document.getElementsByTagName('body')[0].appendChild(input);
		document.getElementById('copyInput').select();
		document.execCommand('copy');
		item.$message({
		  message: '{lang copy_clipboard}',
		  type: 'success'
		});
		document.getElementById('copyInput').remove();

	};
	
</script>

<script type="text/javascript">
	const { createApp, reactive, toRefs, toRef, ref, onMounted, nextTick, watch, computed, onBeforeUpdate } = Vue;
	const dzzoffice_details = createApp({
		el: '#dzzoffice',
		data() {
			return {
				path:'',
				HtmlLoading:true,
				ColorPopver: {
					base: '',
					rgb: '',
					rgba: '',
					hsl: '',
					hsv: '',
					cmyk: ''
				},
				DocumentBack:true,
				DocumentRefresh:1,
				DocumentHref:'',
				DocumentAdminId:'$_G['adminid']',
				HideInformation: false,
				IsFullScreen:false,
				imagesData: {},
				currentData:[],
				paths:[],
				selectindex:0,
				ImgParam:{
					slider:0,
					proportion:0,
					fproportion:0,
					index:0,
					LoadFirst:false,
					scaleX:0,
					scaleY:0,
					rotate:0,
					total:0,
					iswait:false
				},
				imagesSize:{
					width:0,
					height:0,
					show:false
				},
				GetParam:null,
				DocumentThemeColor:'',//dark,
				PostParam:null,
				isadmin:'$isadmin',
				previews:{
					data:[],
					transform:0,
					active:0,

		},
		watch: {

					}
					window.location.hash = 'path='+val;
					
				},
				deep:true,
			},
			
			'ImgParam.proportion':function(val){
				
			},
			'ImgParam.rotate':function(val){
				this.imageTransform();
			},
			'ImgParam.scaleX':function(val){
				this.imageTransform();
			},
			'ImgParam.scaleY':function(val){
				this.imageTransform();
			},
			paths:{
				handler(data){
					if(data && data.length){
						this.ImgParam.total = data.length;
						// this.ImgParam.index = data.indexOf(this.path)+1;
					}else{
						this.ImgParam.total = 1;
						// this.ImgParam.index = 1;
					}
				},
				deep:true,
				immediate:true
			},
			imagesData:{
				handler(dasta){
					var self = this;
					self.$nextTick(function(){
						if(!dasta.iniframe){
							self.imageSet();
						}
						self.FramePreviewInstallKeyboard();
					});
				},
				deep:true,
			},
			'ImgParam.iswait':{

					<!--{if $opentype=='current'}-->
					if(!val){
						this.headerCarouselArrow('right');
					}
					<!--{/if}-->
				},
				deep:true
			},
			DocumentThemeColor:{
				handler(newval){
					document.querySelector('html').className = newval
				},
				deep:true,
				// immediate:true
			}
		},
		mixins:[headerMixin,rightMixin,ImageMixin,ShareAddDialogMixin],
		created() {
			var self = this;
			//主题颜色
			let theme = localStorage.getItem('theme');

			if(theme){
				this.DocumentThemeColor=theme;
			}else{
				this.DocumentThemeColor = 'light'
			}
			axios.interceptors.response.use(function(response){
				if(response.data && response.data.isuser && parseInt(response.data.loginstatus)==0){
					self.LoginFormhash = response.data.hash;
					self.LoginVisible = true;
					return 'intercept';
				}
				return response;
			});
			let url = sessionStorage.getItem('href');
			this.DocumentHref = url;

			var arr = (location.hash || "").replace(/^\?/,'').split("&");
			if(arr.length){
				path=arr[0].replace("#","").split('=')[1];
				this.path = path;
			}
			if(!this.path){
				var storpath = sessionStorage.getItem('detailpath');
				if(storpath){
					this.path = storpath;
				}
			}
			let paths = sessionStorage.getItem('imgs');
			if(paths){
				this.paths = paths.split(',');
			}
			this.ImgParam.index = parseInt(sessionStorage.getItem('selectindex'))+1;
			<!--{if $opentype=='current'}-->
			if(window.parent.dzzoffice && window.parent.dzzoffice.WindowThis && window.parent.dzzoffice.WindowThis.ImageDataParam){
				var StoreImgdatas = JSON.parse(JSON.stringify(window.parent.dzzoffice.WindowThis.ImageDataParam.data));
				for(var i in StoreImgdatas){
					let data = StoreImgdatas[i];
					this.currentData.push(data);
				}
			}
			<!--{else}-->
			
			var imgparam = JSON.parse(sessionStorage.getItem('imgparam'));
			this.GetParam = imgparam;
			
			<!--{/if}-->	
			if(this.path){
				this.GetData();
			}else{
				self.$message.error('{lang page_error}');
			}
		},
		
		
		methods: {
			FramePreviewEditableTarget(target){
				if(!target || !target.closest) return false;
				return !!target.closest('input,textarea,select,[contenteditable="true"],[role="textbox"]');
			},
			FramePreviewFindVideo(rootDocument){
				try{
					if(!rootDocument || !rootDocument.querySelectorAll) return null;
					const videos = rootDocument.querySelectorAll('video');
					let fallback = videos.length ? videos[0] : null;
					for(let index = 0; index < videos.length; index++){
						if(videos[index].readyState >= 1) return videos[index];
					}
					const frames = rootDocument.querySelectorAll('iframe');
					for(let index = 0; index < frames.length; index++){
						const nested = this.FramePreviewFindVideo(frames[index].contentDocument);
						if(nested) return nested;
					}
					return fallback;
				}catch(error){
					return null;
				}
			},
			FramePreviewParseRate(value){
				if(value === undefined || value === null) return 0;
				const parts = String(value).split('/');
				const rate = parts.length === 2 ? parseFloat(parts[0]) / parseFloat(parts[1]) : parseFloat(parts[0]);
				return isFinite(rate) && rate >= 1 && rate <= 240 ? rate : 0;
			},
			FramePreviewRate(video){
				const measured = parseFloat(video.dataset.pichomeFrameDuration);
				if(isFinite(measured) && measured >= 1/240 && measured <= 1) return 1/measured;
				let rate = this.FramePreviewParseRate(video.getAttribute('data-fps') || video.dataset.fps || video.dataset.frameRate);
				if(rate) return rate;
				rate = this.FramePreviewParseRate(this.imagesData && (this.imagesData.fps || this.imagesData.frame_rate || this.imagesData.framerate));
				return rate || 30;
			},
			FramePreviewClampTime(video,target){
				if(isFinite(video.duration)) target = Math.min(video.duration, target);
				target = Math.max(0, target);
				try{
					for(let index = 0; index < video.seekable.length; index++){
						const start = video.seekable.start(index);
						const end = video.seekable.end(index);
						if(video.currentTime >= start-.05 && video.currentTime <= end+.05){
							return Math.max(start, Math.min(end, target));
						}
					}
				}catch(error){}
				return target;
			},
			FramePreviewSeek(video,direction){
				const step = 1 / this.FramePreviewRate(video);
				let base = parseFloat(video.dataset.pichomeFrameTarget);
				if(!isFinite(base) || Math.abs(base-video.currentTime) > Math.max(.5,step*4)) base = video.currentTime;
				const target = this.FramePreviewClampTime(video, base + direction*step);
				video.dataset.pichomeFrameTarget = String(target);
				video.currentTime = target;
			},
			FramePreviewStep(direction,rootDocument){
				const video = this.FramePreviewFindVideo(rootDocument || document);
				if(!video || video.readyState < 1) return false;
				if(video.dataset.pichomeFrameAdvancing === '1') return true;
				try{
					video.pause();
					if(direction > 0 && typeof video.requestVideoFrameCallback === 'function'){
						const self = this;
						const token = String((parseInt(video.dataset.pichomeFrameToken) || 0) + 1);
						const muted = video.muted;
						video.dataset.pichomeFrameToken = token;
						video.dataset.pichomeFrameAdvancing = '1';
						video.muted = true;
						let completed = false;
						const finish = function(metadata){
							if(completed || video.dataset.pichomeFrameToken !== token) return;
							completed = true;
							video.pause();
							video.muted = muted;
							delete video.dataset.pichomeFrameAdvancing;
							if(metadata && isFinite(metadata.mediaTime)){
								const previous = parseFloat(video.dataset.pichomeFrameTarget);
								if(isFinite(previous)){
									const duration = metadata.mediaTime-previous;
									if(duration >= 1/240 && duration <= 1) video.dataset.pichomeFrameDuration = String(duration);
								}
								video.dataset.pichomeFrameTarget = String(metadata.mediaTime);
							}
						};
						video.requestVideoFrameCallback(function(now,metadata){ finish(metadata); });
						const promise = video.play();
						if(promise && promise.catch) promise.catch(function(){
							finish(null);
							self.FramePreviewSeek(video,1);
						});
						setTimeout(function(){
							if(completed || video.dataset.pichomeFrameToken !== token) return;
							finish(null);
							self.FramePreviewSeek(video,1);
						},1000);
					}else{
						this.FramePreviewSeek(video,direction);
					}
					return true;
				}catch(error){
					delete video.dataset.pichomeFrameAdvancing;
					return false;
				}
			},
			FramePreviewHandleKeydown(event,rootDocument){
				if(event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return false;
				if(event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return false;
				if(this.FramePreviewEditableTarget(event.target)) return false;
				const direction = event.key === 'ArrowUp' ? -1 : 1;
				if(!this.FramePreviewStep(direction,rootDocument)) return false;
				event.preventDefault();
				event.stopPropagation();
				return true;
			},
			FramePreviewInstallKeyboard(rootDocument){
				const self = this;
				const root = rootDocument || document;
				try{
					root.querySelectorAll('iframe').forEach(function(frame){
						const attach = function(){
							try{
								const frameDocument = frame.contentDocument;
								if(!frameDocument) return;
								if(!frameDocument.__pichomeFrameKeyboard){
									frameDocument.__pichomeFrameKeyboard = true;
									frameDocument.addEventListener('keydown',function(event){ self.FramePreviewHandleKeydown(event,frameDocument); },true);
								}
								self.FramePreviewInstallKeyboard(frameDocument);
							}catch(error){}
						};
						if(!frame.dataset.pichomeFrameKeyboard){
							frame.dataset.pichomeFrameKeyboard = '1';
							frame.addEventListener('load',attach);
						}
						attach();
					});
				}catch(error){}
			},
			DocumentThemeChange(){
				if(this.DocumentThemeColor=='light'){
					this.DocumentThemeColor='dark';
					localStorage.setItem('theme','dark');
				}else{
					this.DocumentThemeColor='light';
					localStorage.setItem('theme','light');
				}
			},
			async GetData(){
				var self = this;
				// self.imagesData.icondata = '';
				// self.imagesData.originalimg = '';
				self.HtmlLoading = true;
				if(self.DocumentRefresh == 1){
					self.LoginFunc = 'refresh';
				}else{
					self.LoginFunc = self.GetData;
				}
				self.DocumentRefresh ++;
				self.LoginParam = null;
				if(self.PostParam){
					self.PostParam();
				}
				var CancelToken = axios.CancelToken;

				axios.post(MOD_URL+'&operation=fetch',{
					path:self.path,
					isadmin:self.isadmin
				},{
					cancelToken: new CancelToken(function executor(c) {
					    self.PostParam = c;
					})
				}).then(function (res) {
					if(res == 'intercept'){
						return false;
					}
					var json = res.data;
					if(json.error){
						self.$confirm(json.error, '{lang prompt}', {
							closeOnPressEscape:false,
							confirmButtonText: '{lang sure}',
							showCancelButton:false,
							showConfirmButton:parseInt(json.status)==2?false:true,
							type: 'warning'
						}).then(function(){
							if(parseInt(json.status) == 2){
								// window.location.href = MOD_URL;
							}else if(parseInt(json.status) == 0){
								sessionStorage.setItem('detailpath',self.path);
								window.location.href = 'user.php?mod=login';
							}
						});          
						
						return false;
					}
					var item = json.resourcesdata;
					// if(item.opentype=='image' || item.opentype=='other'){
					// 	item['icondata'] = (item['icondata']);
					// 	item['realpath'] = (item['realpath']);
					// 	item['originalimg'] = (item['originalimg']);
					// }
					document.title = item.name+'-'+json.sitename;
					self.ImageCollect.rid = [item.rid];
					self.previews.data = item.preview || [];
					var colors = [];
					if(item.colors){
						for(var c in item.colors){
							var cstr = {
								key:c,
								val:item.colors[c]
							};
							colors.push(cstr);
						}
					}
					item.colors = colors;
					
					var tags = [];
					if(item.tag){
						for(var t in item.tag){
							var tstr = {
								tid:t,
								tagname:item.tag[t]
							};
							tags.push(tstr);
						}
					}
					item.tag = tags;
					
					item['level'] = parseInt(item.level);
					var foldernames = [];
					if(item.foldernames){
						for(var f in item.foldernames){
							var fstr = {
								key:f,
								val:item.foldernames[f]
							};
							foldernames.push(fstr);
						}
					}
					item.foldernames = foldernames;
					self.imagesData = item;
					self.HtmlLoading = false;
					var paths = sessionStorage.getItem('imgs');
					if(paths){
						paths = paths.split(',');
						if(self.paths.length != paths.length){
							self.paths = paths;
							var imgparam = sessionStorage.getItem('imgparam');
							self.GetParam = imgparam;
						}
						
					}
					<!--{if $opentype!='current'}-->
					if(window.opener){
						window.opener.postMessage({
							dpath: self.path,
						}, window.location.origin);
						
					}else{
						if(self.GetParam && self.GetParam.ispage && (parseInt(self.ImgParam.total)-parseInt(self.ImgParam.index))<=5){
							self.GetDatafilelist();
						}
					}
					<!--{/if}-->
					self.PostParam = null;	
					self.$nextTick(function () {
						self.previewSize()
					});
				}).catch(function (error) {
				    console.log(error);
				});
			},
			async GetDatafilelist(param1,param2){
				var self = this;
				if(self.GetParam && !self.GetParam.moreurl)return false;
				
				var params = JSON.parse(JSON.stringify(self.GetParam));
				delete params.ispage;
				delete params.moreurl;
				self.LoginFunc = self.GetDatafilelist;
				self.LoginParam = null;
				var res = await axios.post(self.GetParam.moreurl,params);
				if(res == 'intercept'){
					return false;
				}
				if(param2 != 'login' && parseInt(self.GetParam.page)){
					self.GetParam.page += 1;
				}
				var json = res.data.data;
				for(var i in json.data){
					self.paths.push(json.data[i].dpath);
				}
				self.GetParam.ispage = json.next;
				sessionStorage.setItem('imgparam',JSON.stringify(self.GetParam));
				sessionStorage.setItem('imgs',self.paths.join(','));
				
			},
		},
		mounted() {
			var self = this;
			if(document.body.clientWidth>992){

			}else{
				this.HideInformation = true;
			}
			window.onkeydown = function(event){ //event可以简写成 e
				if(self.FramePreviewHandleKeydown(event,document)) return;
				var code = event.keyCode
				if(code == 37){//左边
					self.headerCarouselArrow('left')
				}else if(code == 39){//右边
					self.headerCarouselArrow('right')
				}
			}
			self.FramePreviewInstallKeyboard();
			[100,300,800,1600].forEach(function(delay){
				setTimeout(function(){ self.FramePreviewInstallKeyboard(); },delay);
			});

			// $(document).on('click', '.copy-share-btn', function() {
			// 	var txt = $(this).parent().siblings('.address').text()
			// 	CopyTxt(self, txt);
			// });

			
			window.onresize = function(){
				if(!document.getElementById('ImgScroll')) return ;
				var h = document.getElementById('ImgScroll').clientHeight;
				document.querySelector('#ImgScroll .el-scrollbar__view').style.lineHeight = h+'px';
				self.previewSize();
			}

		
			//禁止鼠标右击
			document.oncontextmenu = function() {
				event.returnValue = false;
				// alert('请不要右击');
				return false;
			};
			//禁用开发者工具F12
			// document.onkeydown = document.onkeyup = document.onkeypress = function(event) {
			// 	let e = event || window.event || arguments.callee.caller.arguments[0];
			// 	if (e && e.keyCode == 123) {
			// 		e.returnValue = false;
			// 		// alert('F12是不礼貌的');
			// 		return false;
			// 	}
			// };
			<!--{if $opentype=='current'}-->
			window.addEventListener('message',function(event){

				var data = event.data.data;
                if(!data) return;
				var paths = [];
				var currentData = [];
				for(var i in data){
					paths.push(data[i].dpath);
					currentData.push(data[i]);
				}
				self.paths = paths;
				self.currentData = currentData;
				self.ImgParam.iswait = false;
				self.HtmlLoading = false;
			});
			try{window.parent.document.querySelector('.Details-Iframe-wrapper').lastChild.style.opacity  = "1";}catch(e){}
			<!--{else}-->
			window.onhashchange = function(){
				if(self.DocumentBack){
					var arr = (location.hash || "").replace(/^\?/,'').split("&");
					if(arr.length){
						path=arr[0].replace("#","").split('=')[1];
						var index = self.paths.indexOf(path);
						sessionStorage.setItem('selectindex',index);
					}
					document.location.reload();
					return false;
				}
				self.DocumentBack = true;
			}
			<!--{/if}-->
			// if(window.__canvasWM){
			// 	window.__canvasWM({
			// 		width:'300px',
			// 		height:'220px',
			// 		content: "{eval echo $_G['username'].' '.dgmdate($_G['timestamp'],'Y-m-d H:i')}",
			// 	});
			// }
		},

	});
	dzzoffice_details.use(ElementPlus, {
		locale: {$_G['language_list'][$_G['language']]['elementflagCamel']},
	});
	for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
		dzzoffice_details.component(key, component)
	}
	dzzoffice_details.component('comavatar', comavatar);
	dzzoffice_details.component('tem_tag', tem_tag);
	dzzoffice_details.component('international',international);
	dzzoffice_details.use(DzzCollectdialog);
	// 屏蔽警告信息
	dzzoffice_details.config.warnHandler = function(){return null};
	dzzoffice_details.mount('#dzzoffice');

</script>
