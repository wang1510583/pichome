
<div style="width: 50px;text-align: center;height: 50px;line-height: 50px;" @click.stop="HeaderNavbarLeftClick">
	<el-icon style="color: var(--el-text-color-primary);"><Arrow-Left-Bold /></el-icon>
</div>
<div style="display:flex;align-items:center;height:50px;">
	<div
		v-if="MobileFrameScrubSensitivityVisible()"
		class="mobile-frame-scrub-sensitivity-button"
		role="button"
		:aria-label="'{lang frame_scrub_sensitivity} '+MobileFrameScrubPixelsPerFrame+'px · {lang frame_scrub_switch}'"
		@click.stop="MobileToggleFrameScrubSensitivity">
		<span>{{MobileFrameScrubPixelsPerFrame}}px</span>
	</div>
	<div
		v-if="MobileMirrorPreviewVisible()"
		class="mobile-mirror-preview-button"
		:class="{'is-active':MobileMirrorPreview}"
		style="width: 50px;text-align: center;height: 50px;line-height: 50px;font-size: var(--el-font-size-extra-large);"
		role="button"
		:aria-label="MobileMirrorPreview?'{lang cancel_mirror_preview}':'{lang mirror_preview}'"
		:aria-pressed="MobileMirrorPreview?'true':'false'"
		@click.stop="MobileToggleMirrorPreview">
		<svg class="mirror-preview-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
			<path d="M12 3v18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"></path>
			<path d="M9.5 5 3.5 12l6 7V5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"></path>
			<path d="m14.5 5 6 7-6 7V5Z" fill="currentColor"></path>
		</svg>
	</div>
	<div
		v-if="MobileVideoCoverVisible()"
		style="width: 50px;text-align: center;height: 50px;line-height: 50px;font-size: var(--el-font-size-extra-large);"
		role="button"
		aria-label="{lang set_current_frame_as_cover}"
		@click.stop="MobileSetCurrentVideoFrameAsCover">
		<el-icon v-if="VideoCoverLoading" class="is-loading"><Loading></Loading></el-icon>
		<el-icon v-else><Picture-Filled></Picture-Filled></el-icon>
	</div>
	<div style="width: 50px;text-align: center;height: 50px;line-height: 50px;font-size: var(--el-font-size-extra-large);" @click.stop="InformationPopup=true">
		<el-icon><More></More></el-icon>
	</div>
</div>

<script type="text/javascript">
	var HeaderMixin = {
		data(){
			return {
				MobileFrameScrubPixelsPerFrame:(function(){
					try{
						let value = localStorage.getItem('pichomeFrameScrubPixels') || localStorage.getItem('pichomeDesktopFrameScrubPixels');
						return value == '14' || value == '3' ? 14 : 7;
					}catch(error){return 7;}
				})()
			};
		},
		methods:{
			MobileFrameScrubSensitivityVisible(){
				const current = this.showdata && this.showdata[this.showdataindex];
				if(!current || current.loading || !current.data || !current.data.rid) return false;
				const data = current.data;
				return data.type == 'video' || data.opentype == 'video';
			},
			MobileToggleFrameScrubSensitivity(){
				if(!this.MobileFrameScrubSensitivityVisible()) return false;
				this.MobileFrameScrubPixelsPerFrame = this.MobileFrameScrubPixelsPerFrame == 14 ? 7 : 14;
				try{
					localStorage.setItem('pichomeFrameScrubPixels',String(this.MobileFrameScrubPixelsPerFrame));
					localStorage.setItem('pichomeDesktopFrameScrubPixels',String(this.MobileFrameScrubPixelsPerFrame));
				}catch(error){}
				if(window.PichomeFrameScrub && window.PichomeFrameScrub.setPixelsPerFrame){
					window.PichomeFrameScrub.setPixelsPerFrame(document,this.MobileFrameScrubPixelsPerFrame);
				}
				return true;
			},
			MobileInstallFrameScrubDocument(rootDocument,item){
				try{
					const api = window.PichomeFrameScrub || window.PichomeDesktopFrameScrub;
					if(!api || !api.installDocument || !rootDocument || !rootDocument.querySelectorAll) return false;
					const mediaItem = item || (this.showdata && this.showdata[this.showdataindex]);
					const data = mediaItem && mediaItem.data;
					if(!data || !data.rid) return false;
					api.installDocument(rootDocument,{
						rid:data.rid,
						path:mediaItem.id || data.dpath || this.path,
						endpoint:MOD_URL+'&op=fileinterface',
						profile:'mobile-hq',
						pixelsPerFrame:this.MobileFrameScrubPixelsPerFrame,
						allowMouse:false,
						allowTouch:true,
						preload:false
					});
					const self = this;
					rootDocument.querySelectorAll('iframe').forEach(function(frame){
						frame.__pichomeMobileFrameScrubItem = mediaItem;
						const install = function(){
							try{
								self.MobileInstallFrameScrubDocument(frame.contentDocument,frame.__pichomeMobileFrameScrubItem);
							}catch(error){}
						};
						install();
						if(frame.dataset.pichomeMobileFrameScrubBound != '1'){
							frame.dataset.pichomeMobileFrameScrubBound = '1';
							frame.addEventListener('load',install);
						}
					});
					return true;
				}catch(error){
					return false;
				}
			},
			MobileFrameScrubIframeLoad(event){
				try{
					const frame = event.currentTarget || event.target;
					const mediaItem = {
						id:frame.dataset.pichomeFramePath || this.path,
						data:{rid:frame.dataset.pichomeFrameRid || ''}
					};
					return this.MobileInstallFrameScrubDocument(frame.contentDocument,mediaItem);
				}catch(error){
					return false;
				}
			},
			MobileMirrorPreviewVisible(){
				const current = this.showdata && this.showdata[this.showdataindex];
				if(!current || current.loading || !current.data || !current.data.rid) return false;
				const data = current.data;
				const isVideo = data.type == 'video' || data.opentype == 'video';
				const isImage = !data.iniframe && !!(data.originalimg || data.icondata);
				return isVideo || isImage;
			},
			MobileMirrorSetDocument(rootDocument,enabled){
				try{
					if(!rootDocument || !rootDocument.querySelectorAll) return;
					if(enabled && !rootDocument.getElementById('pichome-mirror-preview-style')){
						const style = rootDocument.createElement('style');
						style.id = 'pichome-mirror-preview-style';
						style.textContent = '.pichome-mirror-preview-target{transform:scaleX(-1)!important;transform-origin:center center!important;}';
						(rootDocument.head || rootDocument.documentElement).appendChild(style);
					}
					rootDocument.querySelectorAll('video').forEach(function(video){
						video.classList.toggle('pichome-mirror-preview-target',!!enabled);
					});
					const self = this;
					rootDocument.querySelectorAll('iframe').forEach(function(frame){
						try{self.MobileMirrorSetDocument(frame.contentDocument,enabled);}catch(error){}
					});
				}catch(error){}
			},
			MobileApplyMirrorPreview(enabled){
				const self = this;
				const center = document.querySelector('.detail-popup-content.center');
				if(!center) return;
				center.querySelectorAll('.image-viewer__img,video').forEach(function(media){
					media.classList.toggle('pichome-mirror-preview-target',!!enabled);
				});
				center.querySelectorAll('iframe').forEach(function(frame){
					const apply = function(){
						try{self.MobileMirrorSetDocument(frame.contentDocument,enabled);}catch(error){}
					};
					apply();
					if(frame.dataset.pichomeMirrorPreviewBound != '1'){
						frame.dataset.pichomeMirrorPreviewBound = '1';
						frame.addEventListener('load',function(){
							self.MobileMirrorSetDocument(frame.contentDocument,self.MobileMirrorPreview);
						});
					}
				});
			},
			MobileToggleMirrorPreview(){
				if(!this.MobileMirrorPreviewVisible()) return false;
				this.MobileMirrorPreview = !this.MobileMirrorPreview;
				const self = this;
				this.$nextTick(function(){self.MobileApplyMirrorPreview(self.MobileMirrorPreview);});
				return true;
			},
			MobileVideoCoverVisible(){
				const current = this.showdata && this.showdata[this.showdataindex];
				if(!current || current.loading || !current.data) return false;
				const data = current.data;
				const canEdit = parseInt(data.edit) || parseInt(this.DocumentAdminId) === 1;
				return !!canEdit && (data.type == 'video' || data.opentype == 'video');
			},
			MobileFindVideo(rootDocument){
				try{
					if(!rootDocument || !rootDocument.querySelectorAll) return null;
					const videos = rootDocument.querySelectorAll('video');
					for(let index = 0; index < videos.length; index++){
						if(videos[index].readyState >= 1) return videos[index];
					}
					const frames = rootDocument.querySelectorAll('iframe');
					for(let index = 0; index < frames.length; index++){
						const nested = this.MobileFindVideo(frames[index].contentDocument);
						if(nested) return nested;
					}
					return videos.length ? videos[0] : null;
				}catch(error){
					return null;
				}
			},
			async MobileSetCurrentVideoFrameAsCover(){
				if(this.VideoCoverLoading) return false;
				const self = this;
				const video = self.MobileFindVideo(document);
				if(!video || video.readyState < 1){
					ElMessage.error('{lang video_cover_player_not_ready}');
					return false;
				}
				try{
					video.pause();
					self.VideoCoverLoading = true;
					const response = await axios.post(MOD_URL+'&op=fileinterface&operation=setVideoCover',{
						path:self.path,
						currentTime:video.currentTime
					});
					const result = response.data || {};
					if(!result.success){
						ElMessage.error(result.msg || '{lang video_cover_set_failed}');
						return false;
					}
					const current = self.showdata[self.showdataindex];
					if(current && current.data && result.data){
						current.data.icondata = result.data.cover || current.data.icondata;
						current.data.originalimg = result.data.largeCover || current.data.originalimg;
						self.storagedata[self.path] = current.data;
					}
					ElMessage.success(result.msg || '{lang video_cover_set_success}');
					return true;
				}catch(error){
					ElMessage.error('{lang video_cover_set_failed}');
					return false;
				}finally{
					self.VideoCoverLoading = false;
				}
			},
			HeaderNavbarLeftClick(){
				let div = window.parent.document.querySelector('.Details-Iframe');
				if(div){
					div.remove();
				}
				// window.parent.pvue.JsDetailsPopup.src = '';
				// if(this.GetParam.historygo){
				// 	window.location.href = this.GetParam.historygo
				// }else{
				// 	window.location.href = MOD_URL;
				// }
				
			},
		}
	};
</script>
