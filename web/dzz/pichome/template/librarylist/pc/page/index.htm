<script>
	function tabgroup_callback(data,flag){
		dzzoffice.WindowThis.RightTabGroup(data,flag)
	}
	function lefttabgroup_callback(data,flag){
		dzzoffice.WindowThis.LeftTabGroup(data,flag)
	}
	const { createApp, reactive, toRefs, toRef, ref, onMounted, nextTick, watch, computed, onBeforeUpdate } = Vue;
	var dzzoffice = createApp({
		data(){
			return {
				DocumentOverlay:{
					left:false,
					screen:false,
					main:false,
					right:false
				},
				fMOD_URL:MOD_URL,
				DocumentResize:0,
				DocumentAppid:'',
				DocumentCtrl:false,
				DocumentDropActive:false,
				DocumentDropActive1:false,
				OpenDetailType:'new',
				scrollref:null,
				DocumentThemeColor:'',//dark
				DocumentVapp:{appname:'',type:0},
				ispc:window.innerWidth > 768,
				MobileSidebar:{left:false,right:false},
				MobileSidebarWidth:Math.max(260, Math.min(320, window.innerWidth - 44)),
				main_scrollbar_loading:false
			}
		},
		watch: {
			DocumentThemeColor:{
				handler(newval){
					document.querySelector('html').className = newval
				},
				deep:true,
				// immediate:true
			},
			'ImageIcon.data':{
				handler(newval){
					this.ImageGetThumb();
				},
				deep:true
			}
		},
		created(){
			this.handleIsPc();
			<!--{if $_GET['do'] == 'tags' ||  $_GET['do'] == 'user'}-->
			this.DocumentAppid = '$appid';
			<!--{else}-->
			this.DocumentAppid = this.CommonGetHashParam('appid');
			if(this.DocumentAppid){
				this.ScreenParam.appid = this.DocumentAppid;
				var ShowScreen = localStorage.getItem('showscreen')? localStorage.getItem('showscreen'):1;
				if(parseInt(ShowScreen)){
					this.Screenshow = true;
				}else{
					this.Screenshow = false;
				}
			}
			<!--{/if}-->
		},
		
		mixins:[leftMixins,HeaderMixins,ScreenMixin,CommonMixin,MixinImage,UploaderMinxins,RightMixin,MainMixins,FileMixins,Upload{$_G['setting']['defaultspacesetting']['bz']}Minxins,ShareAddDialogMixin],
		
		methods:{
			DocumentPageContentNotChecked(){
				if(this.RightType == 'folder'){
					if(this.RightActivefid[0] != this.LeftTree.Currentkey){
						this.RightParamClean();
						this.RightType = 'folder';
						this.RightActivefid = [this.LeftTree.Currentkey];
						this.RightGetData();
					}
				}else if(this.RightType == 'file'){
					this.RightParamClean();
					if(this.LeftCurrenType == 'filelist'){
						this.RightType = 'folder';
						this.RightActivefid = [this.LeftTree.Currentkey];
						
					}else{
						this.RightType = JSON.parse(JSON.stringify(this.LeftCurrenType));
					}
					this.RightGetData();
				}
			},
			ImageDropReadString(item) {
				return new Promise(resolve => {
					if(!item || typeof item.getAsString !== 'function') return resolve('');
					try{ item.getAsString(value => resolve(value || '')); }
					catch(error){ resolve(''); }
				});
			},
			ImageDropNormalizeFile(file) {
				if(!file || !file.size) return null;
				const name = String(file.name || '').trim();
				if(/\.[a-z0-9]{1,8}$/i.test(name)) return file;
				const extensions = {
					'image/jpeg':'jpg',
					'image/png':'png',
					'image/gif':'gif',
					'image/webp':'webp',
					'image/bmp':'bmp',
					'image/x-ms-bmp':'bmp',
					'image/svg+xml':'svg',
					'video/mp4':'mp4',
					'video/quicktime':'mov',
					'video/x-matroska':'mkv',
					'application/x-matroska':'mkv',
					'video/webm':'webm',
					'video/x-msvideo':'avi',
					'video/avi':'avi',
					'video/x-m4v':'m4v'
				};
				const extension = extensions[String(file.type || '').toLowerCase()];
				// Some browsers expose a dragged online video with an empty or generic
				// MIME type. Keep its bytes and let the server verify the real format.
				if(!extension) return file;
				const basename = name.replace(/[. ]+$/, '') || ('online-image-'+Date.now());
				try{
					return new File([file], basename+'.'+extension, {
						type:file.type,
						lastModified:file.lastModified || Date.now()
					});
				}catch(error){
					try{
						Object.defineProperty(file, 'name', {value:basename+'.'+extension});
						return file;
					}catch(ignore){
						return null;
					}
				}
			},
			async ImageDropExtractRemoteUrls(dataTransfer) {
				const htmlValues = [];
				const textValues = [];
				if(!dataTransfer) return [];
				try{
					const html = dataTransfer.getData('text/html');
					const uri = dataTransfer.getData('text/uri-list');
					const text = dataTransfer.getData('text/plain');
					if(html) htmlValues.push(html);
					if(uri) textValues.push(uri);
					if(text) textValues.push(text);
				}catch(error){}
				if(dataTransfer.items && dataTransfer.items.length){
					for(let index = 0; index < dataTransfer.items.length; index++){
						const item = dataTransfer.items[index];
						if(item.kind !== 'string') continue;
						const value = await this.ImageDropReadString(item);
						if(!value) continue;
						if(item.type === 'text/html') htmlValues.push(value);
						else textValues.push(value);
					}
				}
				const videoUrls = [];
				const imageUrls = [];
				for(const html of htmlValues){
					try{
						const documentNode = new DOMParser().parseFromString(html, 'text/html');
						documentNode.querySelectorAll('video[src], video source[src]').forEach(video => videoUrls.push(video.getAttribute('src')));
						documentNode.querySelectorAll('a[href]').forEach(anchor => {
							const href = anchor.getAttribute('href');
							if(/\.(mp4|mov|mkv|webm|avi|m4v)(?:[?#]|$)/i.test(href || '')) videoUrls.push(href);
						});
						documentNode.querySelectorAll('img[src]').forEach(image => imageUrls.push(image.getAttribute('src')));
					}catch(error){}
				}
				const fallbackUrls = [];
				for(const value of textValues){
					String(value).split(/\r?\n/).forEach(line => {
						line = line.trim();
						if(line && line.charAt(0) !== '#'){
							const matches = line.match(/https?:\/\/[^\s"'<>]+/ig) || [];
							fallbackUrls.push(...matches);
						}
					});
				}
				const candidates = videoUrls.length ? videoUrls : (imageUrls.length ? imageUrls : fallbackUrls);
				return [...new Set(candidates.map(url => String(url).replace(/&amp;/g, '&').replace(/[),.;]+$/, '')).filter(url => /^https?:\/\//i.test(url)))].slice(0, 20);
			},
			async ImageUploadRemoteUrls(urls) {
				if(!urls.length) return;
				const self = this;
				let fid = this.UploadCurrentFolderId();
				if(fid === 'root' || fid === '0') fid = '';
				let succeeded = 0;
				let skipped = 0;
				const errors = [];
				this.$message({type:'info', message:'正在下载 '+urls.length+' 个在线素材…'});
				for(const url of urls){
					try{
						let {data: response} = await axios.post(MOD_URL+'&op=library&do=upload&operation=remoteupload', {
							url:url,
							appid:this.DocumentAppid,
							pfid:fid
						});
						if(response && response.success && response.data && response.data.duplicate){
							const uploadDuplicate = await this.UploadConfirmDuplicate(response.data.existing, response.data.filename);
							if(!uploadDuplicate){
								skipped += 1;
								continue;
							}
							({data: response} = await axios.post(MOD_URL+'&op=library&do=upload&operation=remoteupload', {
								url:url,
								appid:this.DocumentAppid,
								pfid:fid,
								duplicate_action:'upload'
							}));
						}
						if(response && response.success) succeeded += 1;
						else errors.push((response && (response.msg || response.message)) || '下载失败');
					}catch(error){
						errors.push((error.response && error.response.data && error.response.data.msg) || error.message || '下载失败');
					}
				}
				if(succeeded){
					if(self.$refs.RefImageLayout) self.$refs.RefImageLayout.restart();
					this.CommonGetImageData();
					if(this.LeftTreeForceRefreshNum) this.LeftTreeForceRefreshNum();
					else this.LeftTreeGetFolderNum();
					if(this.LeftGetAllNum) this.LeftGetAllNum();
				}
				if(errors.length) this.$message({type:'warning', message:'在线素材添加 '+succeeded+' 个，跳过 '+skipped+' 个，失败 '+errors.length+' 个：'+errors[0]});
				else if(skipped) this.$message({type:'info', message:'在线素材添加 '+succeeded+' 个，已跳过 '+skipped+' 个重复项'});
				else this.$message({type:'success', message:'已添加 '+succeeded+' 个在线素材'});
			},
			async ImageUploadDropEvent(e) {
				const self = this;
				if(this.LeftCurrenType == 'recycle' || ![0,3].includes(parseInt(this.DocumentVapp.type))){
					return false;
				}
				e.preventDefault();
				const dataTransfer = e.dataTransfer;
				const remoteUrls = await this.ImageDropExtractRemoteUrls(dataTransfer);
				if(remoteUrls.length){
					await this.ImageUploadRemoteUrls(remoteUrls);
					this.DocumentDropActive = false;
					return false;
				}

				let localFileCount = 0;
				if(dataTransfer.items && dataTransfer.items.length){
					for (let index = 0; index < dataTransfer.items.length; index++) {
						const element = dataTransfer.items[index];
						if(element.kind && element.kind !== 'file') continue;
						const folder = typeof element.webkitGetAsEntry === 'function' ? element.webkitGetAsEntry() : null;
						if (folder && folder.isDirectory) {
							localFileCount += 1;
							readFolder(folder).then(files=>{
								this.UploadFileChange(files,'drop');
							});
						}else{
							const file = this.ImageDropNormalizeFile(element.getAsFile());
							if(file){
								localFileCount += 1;
								this.UploadChange([file],'drop');
							}
						}
					}
				}
				if(!localFileCount && dataTransfer.files && dataTransfer.files.length){
					for(let index = 0; index < dataTransfer.files.length; index++){
						const file = this.ImageDropNormalizeFile(dataTransfer.files[index]);
						if(file){
							localFileCount += 1;
							this.UploadChange([file],'drop');
						}
					}
				}
				if(!localFileCount){
					this.$message({type:'warning', message:'没有识别到可上传的本地文件或在线素材地址'});
				}
			
				this.DocumentDropActive = false;
				async function readFolder(folder) {
					const files = [];
					const reader = folder.createReader();
					while(true) {
						const entries = await new Promise(resolve => {
							reader.readEntries(resolve); 
						});
						
						if(!entries.length) break;
						const promises = entries.map(async item => {
							if(item.isFile) {
								let entry = await doSomethingAsync(item);
								files.push(entry); // 获取文件对象
							} else if(item.isDirectory) {
								files.push(...await readFolder(item)); // 递归读取子文件夹
							}
						});

						// 并发执行所有promise
						await Promise.all(promises);
					}
					
					return files;
				}
				async function doSomethingAsync(entry) {
					let data = '';
					let promises = await new Promise(resolve => {
						entry.file(file => {
							let rawurl = entry.fullPath;
							rawurl = rawurl.substr(rawurl.indexOf('/') + 1);
							file['fullPath'] = rawurl;
							// 获取文件成功  
							resolve(file)
						}, error => {
						// 获取文件失败
							console.log('{lang get_data_fail}');
						});
					});
					return promises;
				}
			},

			});
			// ==== 素材卡片拖拽：站内移动分类 / Chrome 拖出下载 ====
			const PICHOME_DRAG_MIME = 'text/pichome-rids';
			const PICHOME_DOWNLOAD_DRAG_MIME = 'application/x-pichome-download+json';
			let pichomeDragCard = null;
			let pichomeExpandTimer = null;
			function pichomeGetDragRids(ev){
				if(ev && ev.dataTransfer){
					try{
						const v = ev.dataTransfer.getData(PICHOME_DRAG_MIME);
						if(v){
							const arr = JSON.parse(v);
							if(Array.isArray(arr) && arr.length) return arr;
						}
					}catch(err){}
				}
				return (window.__pichomeDragRids && window.__pichomeDragRids.length) ? window.__pichomeDragRids.slice() : [];
			}
			function pichomeGetDragResource(rid){
				const mapped = window.__pichomeDragResources && window.__pichomeDragResources[String(rid)];
				if(mapped) return mapped;
				const lists = [];
				if(self.ImageDataParam && Array.isArray(self.ImageDataParam.data)) lists.push(self.ImageDataParam.data);
				if(self.$refs.RefImageLayout && Array.isArray(self.$refs.RefImageLayout.NewImageData)) lists.push(self.$refs.RefImageLayout.NewImageData);
				for(let i = 0; i < lists.length; i++){
					const item = lists[i].find(function(current){
						return current && String(current.rid) === String(rid);
					});
					if(item) return item;
				}
				return null;
			}
			function pichomeCanDragDownload(item){
				if(!item || !item.dpath) return false;
				const permission = (typeof item.download !== 'undefined') ? item.download : item.down;
				return permission === true || parseInt(permission, 10) > 0 || String(permission).toLowerCase() === 'true';
			}
			function pichomeDragMimeType(ext){
				const types = {
					jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', gif:'image/gif',
					webp:'image/webp', bmp:'image/bmp', svg:'image/svg+xml',
					mp4:'video/mp4', mov:'video/quicktime', mkv:'video/x-matroska',
					webm:'video/webm', avi:'video/x-msvideo', m4v:'video/x-m4v'
				};
				return types[ext] || 'application/octet-stream';
			}
			function pichomeDragFilename(item){
				const ext = String(item.ext || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12);
				const suffix = ext ? '.' + ext : '';
				let filename = String(item.name || item.filename || item.rid || 'pichome');
				if(suffix && filename.toLowerCase().slice(-suffix.length) !== suffix) filename += suffix;
				filename = filename.replace(/[\x00-\x1f\\\/:*?"<>|]/g, '_').trim();
				if(!filename) filename = 'pichome' + suffix;
				if(filename.length > 180){
					let basename = filename;
					if(suffix && filename.toLowerCase().slice(-suffix.length) === suffix) basename = filename.slice(0, -suffix.length);
					filename = basename.slice(0, Math.max(1, 180 - suffix.length)).replace(/[. ]+$/g, '') + suffix;
				}
				return filename;
			}
			function pichomeDragDownloadUrl(item){
				if(!item || !item.dpath) return '';
				const modurl = (typeof MOD_URL === 'string' && MOD_URL) ? MOD_URL : 'index.php?mod=pichome';
				// Use the origin that is already authenticated in this Chrome tab.
				// SITEURL may point at another configured domain/port.
				const url = new URL(modurl, window.location.href);
				url.searchParams.set('op', 'download');
				url.searchParams.delete('do');
				url.searchParams.set('dpath', String(item.dpath));
				return url.href;
			}
			function pichomeSetChromeDownloadDrag(ev, item){
				if(!ev || !ev.dataTransfer || !pichomeCanDragDownload(item)) return false;
				const ext = String(item.ext || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12);
				const filename = pichomeDragFilename(item);
				const downloadUrl = pichomeDragDownloadUrl(item);
				if(!downloadUrl) return false;
				// Chromium's DownloadURL payload is: MIME type : filename : URL.
				try{
					ev.dataTransfer.setData(PICHOME_DOWNLOAD_DRAG_MIME, JSON.stringify({
						url:downloadUrl,
						name:filename,
						type:pichomeDragMimeType(ext)
					}));
				}catch(err){}
				ev.dataTransfer.setData('text/uri-list', downloadUrl);
				ev.dataTransfer.setData('text/plain', downloadUrl);
				ev.dataTransfer.setData('text/html', '<a href="' + downloadUrl.replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '" download="' + filename.replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '">' + filename.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</a>');
				// Set this last so another textual flavour cannot become Chrome's
				// promised-file fallback.
				ev.dataTransfer.setData('DownloadURL', pichomeDragMimeType(ext) + ':' + filename + ':' + downloadUrl);
				return true;
			}
			function pichomeClearDropUI(){

				const nodeEl = el && el.closest ? el.closest('.el-tree-node') : null;

			document.addEventListener('mousedown', function(ev){

				const card = ev.target && ev.target.closest ? ev.target.closest('[data-rid]') : null;
				if(!card || !document.body.contains(card)){ pichomeDragCard = null; return; }
				pichomeDragCard = card;

			window.addEventListener('mouseup', function(){
				if(pichomeDragCard){

			}, true);
			// dragstart: 站内保留 rid 移动；Chrome 单素材拖到站外时下载原文件。
			document.addEventListener('dragstart', function(ev){
				const card = ev.target && ev.target.closest ? ev.target.closest('[data-rid]') : null;
				if(!card || !ev.dataTransfer) return;
				const rid = card.getAttribute('data-rid');
				if(!rid) return;
				let rids = [rid];
				const checked = (self.ImageParam && self.ImageParam.checkedKdys) || [];
				if(checked.length > 1 && checked.indexOf(rid) > -1) rids = checked.slice();
				try{ ev.dataTransfer.setData(PICHOME_DRAG_MIME, JSON.stringify(rids)); }catch(err){}
				const dragItem = pichomeGetDragResource(rid);
				let hasDownload = false;
				if(rids.length === 1){
					try{ hasDownload = pichomeSetChromeDownloadDrag(ev, dragItem); }catch(err){}

				if(!hasDownload){
					// Never expose the internal RID to external drop targets.  The custom
					// MIME type and in-page state above still drive category moves.
					try{ ev.dataTransfer.setData('text/plain', dragItem ? pichomeDragFilename(dragItem) : 'Pichome 素材'); }catch(err){}

				window.__pichomeDragRids = rids;

				pichomeClearDropUI();

			document.addEventListener('dragend', function(){

							if(self.$refs.RefImageLayout){ self.$refs.RefImageLayout.restart(); }
							self.CommonGetImageData();
							if(self.LeftTreeForceRefreshNum){ self.LeftTreeForceRefreshNum(); } else { self.LeftTreeGetFolderNum(); }
							if(self.LeftGetAllNum){ self.LeftGetAllNum(); }
						}else{
							self.$message({type:'error', message:(res && (res.msg || (res.data && res.data.msg))) || '移动失败'});
						}
					}catch(err){
						self.$message({type:'error', message:'移动请求失败'});
					}
				}, true);
			}
			// ==== 素材卡片拖拽 END ====

			dzzoffice.WindowThis = this;
		}
	});
	dzzoffice.use(ElementPlus, {
		<!--{if $_G['language']=='zh-CN'}-->
		locale: {$_G['language_list'][$_G['language']]['elementflagCamel']},
		<!--{/if}-->
	});

	for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
		dzzoffice.component(key, component)
	}
	// 屏蔽警告信息
	dzzoffice.config.warnHandler = function(){return null};
	dzzoffice.use(DzzScreen);
	dzzoffice.component('comavatar', comavatar);
	dzzoffice.component('international',international);
	dzzoffice.use(ImageLayout);
	dzzoffice.use(DzzCollectdialog);
	dzzoffice.use(ImageFile);
	dzzoffice.component('language',language);
	dzzoffice.component('comsort', comsort);
	dzzoffice.mount('#dzzoffice');
</script>
