<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui">
    <meta name="referrer" content="no-referrer">
    <title>$data['name']</title>
	
    <style type="text/css">
      html, body {width:100%;height:100%;margin:auto;overflow: hidden;background: transparent;box-sizing: border-box}
      .xgplayer-enter{display:none!important;visibility:hidden!important;opacity:0!important;}
      .xgplayer-loading{display:none!important;visibility:hidden!important;opacity:0!important;}
		#mse{
			width:100% !important;
			height:100% !important;
			padding-top:0 !important;
		}
		#canvas {
			position:absolute;top:0;bottom:50px;right:0;left:0;z-index:10;;
			text-align: center;
      	}
		canvas{
			width:100%;height:100%;
		}
		.xgplayer-skin-default.xgplayer-music .xgplayer-cover,.xgplayer-next,.xgplayer-prev{
			display: none;
		}
		.xgplayer-skin-default.xgplayer-music .xgplayer-forward{
			margin-left:15px !important;
		}
		.xgplayer-skin-default.xgplayer-music .xgplayer-controls  .xgplay-icon{
			padding-top:10px !important;
		}
		.xgplayer-skin-default.xgplayer-music .xgplayer-play .xgplayer-icon{
			margin-top:0 !important;
		}
		.xgplayer-skin-default.xgplayer-music .xgplayer-controls .xgplayer-time{
			top:35% !important;
		}
		<!--{if $ismobile}-->
		.xgplayer-skin-default .xgplayer-controls{
			display: -webkit-flex !important;
			display: -moz-box !important;
			display: flex !important;
		}
		<!--{/if}-->
    </style>
	  <script src="{MOD_PATH}/js/xgplayer.js"></script>
	<!--{if $_GET['ext']=='flv' || $_GET['ext']=='m4v'}-->
		<script src="{MOD_PATH}/js/xgplayer-flv.js" charset="utf-8"></script>
	<!--{elseif $_GET['ext']=='m3u8' || $_GET['ext']=='HLS'}-->
		<script src="{MOD_PATH}/js/xgplayer-hls.js" charset="utf-8"></script>
	<!--{elseif $_GET['ext']=='mpg' || $_GET['ext']=='mpeg'}-->
		<script src="{MOD_PATH}/js/xgplayer-shaka.js" charset="utf-8"></script>
	<!--{elseif $_GET['ext']=='mp3' || $_GET['ext']=='ogg' || $_GET['ext']=='wav'}-->
	   <script src="{MOD_PATH}/js/xgplayer.music.js" charset="utf-8"></script>
	<!--{/if}-->
  </head>
  <body>
 <!--{if $_GET['ext']=='mp3' || $_GET['ext']=='ogg' || $_GET['ext']=='wav' }-->
		  <div id="canvas">
				<canvas ></canvas>
		  </div>
		  <!--{/if}-->
		  <div id="mse"></div>

	<script type="text/javascript">
		var pichomeOriginalMediaUrl = $pichomePlayerSourceJson;
		function pichomePauseOuterPreviews() {
			var visited = [window];
			var owner = window.parent !== window ? window.parent : window.opener;
			while (owner && visited.indexOf(owner) < 0) {
				visited.push(owner);
				try {
					owner.dispatchEvent(new owner.CustomEvent('pichome-detail-open'));
					owner = owner.parent !== owner ? owner.parent : owner.opener;
				} catch (ignore) { break; }
			}
		}
		pichomePauseOuterPreviews();
		var pichomeCacheIdentity = $pichomeCacheIdentityJson;
		var pichomePoster = $pichomePosterJson || '';
		var pichomePlayerMediaUrl = pichomeOriginalMediaUrl;
		var pichomeMobileVideoLoop = <!--{if $ismobile && !in_array($_GET['ext'], array('mp3', 'ogg', 'wav'))}-->true<!--{else}-->false<!--{/if}-->;
		var pichomeIsVideoLoop = pichomeMobileVideoLoop;
		try {
			var loopVal = '';
			if (window.parent && window.parent.localStorage) {
				loopVal = window.parent.localStorage.getItem('pichome_video_loop');
			}
			if (!loopVal && window.top && window.top.localStorage) {
				loopVal = window.top.localStorage.getItem('pichome_video_loop');
			}
			if (!loopVal && window.localStorage) {
				loopVal = window.localStorage.getItem('pichome_video_loop');
			}
			pichomeIsVideoLoop = pichomeMobileVideoLoop || (loopVal === '1');
		} catch (ignore) {}
		try {
			if (window.PichomeCache && pichomeCacheIdentity) {
				var pichomeCachedMediaUrl = window.PichomeCache.getCachedMediaUrl(
					pichomeOriginalMediaUrl,
					pichomeCacheIdentity
				) || '';
				if (pichomeCachedMediaUrl) {
					pichomePlayerMediaUrl = pichomeCachedMediaUrl;
				} else {
					window.PichomeCache.cacheMedia(pichomeOriginalMediaUrl, pichomeCacheIdentity);
				}
			}
		} catch (ignore) {}
		function pichomePrepareVideoSound(mediaPlayer) {
			try {
				if (!mediaPlayer) return;
				mediaPlayer.volume = 1;
				mediaPlayer.muted = false;
				var video = mediaPlayer.video || document.querySelector('#mse video');
				if (!video) return;
				video.defaultMuted = false;
				video.muted = false;
				video.volume = 1;
				video.removeAttribute('muted');
			} catch (ignore) {}
		}
		function pichomePlayVideoWithSound(mediaPlayer) {
			pichomePrepareVideoSound(mediaPlayer);
			try {
				var playPromise = mediaPlayer && mediaPlayer.play ? mediaPlayer.play() : null;
				if (playPromise && typeof playPromise.catch === 'function') {
					playPromise.catch(function() {
						// Keep the player unmuted. If the browser blocks audible autoplay,
						// the user can press play and audio starts at full volume.
						pichomePrepareVideoSound(mediaPlayer);
					});
				}
			} catch (ignore) {
				pichomePrepareVideoSound(mediaPlayer);
			}
		}
	</script>
  
	
	<!--{if $_GET['ext']=='mp3' || $_GET['ext']=='ogg' || $_GET['ext']=='wav' }-->
     	<script type="text/javascript">
		document.querySelector('canvas').width=window.innerWidth;
		document.querySelector('canvas').height=window.innerHeight-50;
		 window.addEventListener('resize',function(){
			document.querySelector('canvas').width=window.innerWidth;
			document.querySelector('canvas').height=window.innerHeight-50;
		 });
      let player = new window.Music({
          id: 'mse',
          url: [{src: pichomePlayerMediaUrl, name: '$data['name']', poster: '{$_G['siteurl']}dzz/images/b.gif',vid:'1'}],
          volume: 0.8,
          width: '100%',
          height: 50,
		  preloadNext: false,
		  autoplay: true,
		  loop: pichomeIsVideoLoop,
      });
	  player.crossOrigin = "anonymous";
	  var an=player.analyze(document.querySelector('canvas'))
    /*  an.style = {
		  bgColor: '#c8c8c8',
          color: '#909099'
      }*/
	  an.mode="bar";
	  an.size=2048;
	  an.status='on';
      player.on('playing', function(){
          player.mode = 2;
      });
      try { if (player.play) player.play(); } catch (e) {}
	  
	 
	
      //document.getElementById("canvas").height =  window.innerHeight * 0.36;
	  </script>
	  <!--{elseif $_GET['ext']=='flv' || $_GET['ext']=='m4v'}-->
	   <script type="text/javascript">
		  var player = new FlvPlayer({
          id: 'mse',
          url: pichomePlayerMediaUrl,
          playsinline: true,
          volume: 1,
          "videoInit": true,
          "autoplay": true,
          "loop": pichomeIsVideoLoop,
      });
      pichomePlayVideoWithSound(player);
	  </script>
	  <!--{elseif $_GET['ext']=='m3u8' || $_GET['ext']=='HLS'}-->
	 <script type="text/javascript">
      let player = new HlsPlayer({
          id: 'mse',
          url:pichomePlayerMediaUrl,
          autoplay: true,
          playsinline: true,
          volume: 1,
          height: '100%',
          width: '100%',
		   "videoInit": true,
		   "loop": pichomeIsVideoLoop,
      });
      pichomePlayVideoWithSound(player);
    </script>
	  <!--{elseif $_GET['ext']=='mpg' || $_GET['ext']=='mpeg'}-->
	   <script type="text/javascript">
      var player = new window.ShakaJsPlayer({
        id: 'mse',
        url: pichomePlayerMediaUrl,
        ignores: ['error'],
        playsinline: true,
        volume: 1,
        height: '100%',
          width: '100%',
		   "videoInit": true,
		   "autoplay": true,
		   "loop": pichomeIsVideoLoop,
      });
      pichomePlayVideoWithSound(player);
    </script>
	  <!--{else}-->
	   <script type="text/javascript">
	  
      var player = new Player({
		"id": "mse",
		"url": pichomePlayerMediaUrl,
		"poster": pichomePoster,
		"preload": "auto",
		"playsinline": true,
		"volume": 1,
		"whitelist": [
				""
		],
		"keyShortcut": "on",
		"playbackRate": [
				0.5,
				1,
				1.5,
				2,
				2.5
		],
		"screenShot": false,
		"download": false,
		"pip": false,
		"fluid": true,
		"videoInit": true,
		"autoplay": true,
		"loop": pichomeIsVideoLoop,
      });
      pichomePlayVideoWithSound(player);
   </script>
	  <!--{/if}-->
	  <script type="text/javascript">
		try {
			if (typeof player !== 'undefined' && player && typeof player.on === 'function') {
				player.on('ended', function() {
					var shouldLoop = pichomeMobileVideoLoop;
					try {
						var val = (window.parent && window.parent.localStorage && window.parent.localStorage.getItem('pichome_video_loop')) ||
						          (window.top && window.top.localStorage && window.top.localStorage.getItem('pichome_video_loop')) ||
						          (window.localStorage && window.localStorage.getItem('pichome_video_loop'));
						shouldLoop = pichomeMobileVideoLoop || (val === '1');
					} catch (e) {}
					if (shouldLoop) {
						try {
							player.currentTime = 0;
							var replay = player.play();
							if (replay && replay.catch) replay.catch(function() {});
						} catch (e) {}
					}
				});
			}
		} catch (e) {}
	  </script>
  </body>
</html>
